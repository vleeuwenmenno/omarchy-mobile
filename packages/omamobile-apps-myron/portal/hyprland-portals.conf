# Omarchy Mobile (omamobile-apps-myron): Strata serves open, save and folder
# dialogs (strata.portal, from the strata package); gtk is the fallback if
# Strata is missing. /etc/xdg/xdg-desktop-portal is read before
# omamobile-shell's file in /etc/xdg-desktop-portal, so this one wins and
# repeats the Access choice. A user's ~/.config/xdg-desktop-portal wins over both.
[preferred]
org.freedesktop.impl.portal.Access=omamobile;gtk
org.freedesktop.impl.portal.FileChooser=strata;gtk
