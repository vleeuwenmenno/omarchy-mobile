<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root owns the name. Everyone may call the three methods; the service
     answers each caller from that caller's own user ID (from the bus, never
     from the request) and the methods take no arguments, so there is nothing
     to steer it with. No polkit grant and no activation file. -->
<busconfig>
  <policy user="root">
    <allow own="org.omamobile.LocationUsage1"/>
    <allow send_destination="org.omamobile.LocationUsage1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.omamobile.LocationUsage1"
           send_interface="org.omamobile.LocationUsage1" send_member="GetStatus"/>
    <allow send_destination="org.omamobile.LocationUsage1"
           send_interface="org.omamobile.LocationUsage1" send_member="GetHistory"/>
    <allow send_destination="org.omamobile.LocationUsage1"
           send_interface="org.omamobile.LocationUsage1" send_member="ClearHistory"/>
    <allow send_destination="org.omamobile.LocationUsage1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
