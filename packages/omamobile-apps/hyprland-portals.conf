# Omarchy Mobile (omamobile-apps): the generic phone profile's portal choices.
# /etc/xdg/xdg-desktop-portal is read before omamobile-shell's file in
# /etc/xdg-desktop-portal, so this one wins and repeats the Access choice.
[preferred]
org.freedesktop.impl.portal.Access=omamobile;gtk
# Open, save and folder dialogs from xdg-desktop-portal-gnome: Nautilus's
# libadwaita file chooser, which adapts to the phone's 480 px (sidebar
# collapsed, touch-sized rows), instead of GTK 3's desktop chooser. Only the
# file chooser: the gnome backend's other interfaces need gnome-shell.
org.freedesktop.impl.portal.FileChooser=gnome;gtk
