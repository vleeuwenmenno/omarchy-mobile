# SPDX-License-Identifier: MIT
# Xiaomi myron reference descriptor.
#
# The working phone uses an externally managed Android 16 GKI boot chain.
# Omarchy Mobile has no safe image layout or installer for it yet.  The
# external-android method deliberately makes every generic image, flash, push,
# and installer command fail before it contacts a phone.

CODENAME=myron
NAME="POCO F8 Ultra"
SOC=sm8850
# First downstream compatible read live on 2026-10-24. This generic Qualcomm
# MTP value is identity evidence only, never a register-write guard.
COMPATIBLE="qcom,canoe-mtp"
PACKAGE=omamobile-device-myron
PANEL_SIZE=1200x2608

BOOT_METHOD=external-android
BOOT_IMAGES=""
UFS_RW=""

# Do not add DTB, DTBO, partition, slot, header, command-line, or register
# values until the Xiaomi boot chain has been captured and independently
# reviewed. In particular, the current slot-B-only Pixel installer does not
# represent the arrangement described by the reference repository as
# postmarketOS on A with Android and recovery retained through B.
