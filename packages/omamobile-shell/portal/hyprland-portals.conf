# Omarchy Mobile (omamobile-shell): xdg-desktop-portal's backends on the phone.
# Installed in /etc/xdg-desktop-portal, which xdg-desktop-portal reads AFTER
# /etc/xdg/xdg-desktop-portal: the app profile (omamobile-apps or
# omamobile-apps-myron) puts its file chooser choice in /etc/xdg/..., which
# wins. Without one, the file chooser stays on the Hyprland default
# (hyprland;gtk), i.e. xdg-desktop-portal-gtk.
[preferred]
# The permission question ("Allow Camera to use the camera?") as the phone
# shell's sheet, not GTK's desktop dialog. gtk is the fallback if
# omamobile.portal is missing.
org.freedesktop.impl.portal.Access=omamobile;gtk
