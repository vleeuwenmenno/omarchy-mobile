# SPDX-License-Identifier: MIT
# The pull-request gate for derekross/linux-omarchy-mobile, kept here with
# the tool it runs (tools/kernel-pr-check). It belongs at
# .github/workflows/checks.yml on the kernel repository's omamobile branch;
# see CONTRIBUTING.md section 6.2. It checks out the pull request's commits
# and this repository's tools, then runs the sign-off, prefix, checkpatch
# and identifier checks on its commits, and the W=1, dtbs_check and
# dt_binding_check builds on the pull request merged onto the current base
# (--merge), comparing device-tree warnings with that base.
name: checks

on:
  pull_request:
    branches: [omamobile]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel (sign-offs, checkpatch, W=1, dtbs_check)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: linux
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # The base branch as it is when the job runs, not the event's base.sha:
      # that is recorded at the pull request's last push, and a re-run
      # replays it, so a fix merged since then would never be seen.
      - name: The base, now
        run: git -C linux fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/base"
      - uses: actions/checkout@v5
        with:
          repository: derekross/omarchy-mobile
          path: omarchy-mobile
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm bc bison flex libssl-dev libelf-dev python3-pip yamllint
          pip install --break-system-packages dtschema
      - name: tools/kernel-pr-check
        run: |
          omarchy-mobile/tools/kernel-pr-check -C linux --build "$RUNNER_TEMP/kbuild" --merge \
            origin/base "${{ github.event.pull_request.head.sha }}"
