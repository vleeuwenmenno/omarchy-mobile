# The normal unit runs only after the full provisioner has made its marker.
# This temporary image deliberately bounds that network-dependent provisioner,
# so run the idempotent mobile profile setup on the first graphical login too.
[Unit]
ConditionPathExists=

[Service]
ExecStart=
ExecStart=/usr/local/bin/myron-omarchy-setup-user
