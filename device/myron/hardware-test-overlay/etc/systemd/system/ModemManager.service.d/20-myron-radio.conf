# SPDX-License-Identifier: MIT
# ModemManager may be D-Bus activated early (BusName with the
# dbus-org.freedesktop.ModemManager1.service alias). It runs only after the
# guarded cellular transaction has verified the in-tree rmnet stack and written
# modem-manager-allowed, only through the one-start admission wrapper, and it
# is never restarted: a second open of rmnet_ipa0 can panic stock ipam.ko.
[Unit]
Requires=myron-reference-radio.service
After=myron-reference-radio.service
ConditionPathExists=/run/myron-wireless-ready
ConditionPathExists=/run/omamobile-myron/modem-manager-allowed

[Service]
Restart=no
ExecStart=
ExecStart=/usr/local/sbin/myron-modemmanager-start
