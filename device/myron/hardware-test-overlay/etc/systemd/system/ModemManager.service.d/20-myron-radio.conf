# SPDX-License-Identifier: MIT
# ModemManager may be D-Bus activated early. It runs only after the guarded
# cellular transaction has verified the in-tree rmnet stack and written
# modem-manager-allowed, and it is never restarted: a second open of
# rmnet_ipa0 can panic stock ipam.ko.
[Unit]
Requires=myron-reference-radio.service
After=myron-reference-radio.service
ConditionPathExists=/run/myron-wireless-ready
ConditionPathExists=/run/omamobile-myron/modem-manager-allowed

[Service]
Restart=no
