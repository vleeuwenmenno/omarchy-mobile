[Service]
# This temporary image has no general internet route.  Bound remote-version
# lookups and the whole setup so an optional desktop tool cannot hold SDDM
# behind firstboot until the independent rollback watchdog fires.
Environment=MISE_FETCH_REMOTE_VERSIONS_TIMEOUT=2
# The reused downstream kernel does not yet have a qualified nftables module
# closure. Do not make temporary firstboot retry forever on ufw-init.
Environment=OMAMOBILE_FIRSTBOOT_SKIP_FIREWALL=1
Environment=OMAMOBILE_FIRSTBOOT_DEFER_OMARCHY_PROVISION=1
TimeoutStartSec=3min
