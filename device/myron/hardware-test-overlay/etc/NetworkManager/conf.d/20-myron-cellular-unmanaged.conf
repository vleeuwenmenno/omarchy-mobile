# NetworkManager must not manage, and so must not auto-activate, any modem
# device at boot: stock ipam.ko can panic when rmnet_ipa0 is opened a second
# time. myron-cellular-stage flips the one GSM control device to managed only
# inside its one-shot mutation, immediately before the single explicit
# activation. Unlike [keyfile] unmanaged-devices this is a runtime-overridable
# default, which is exactly what that explicit step needs. Only the GSM control
# device is covered: the data interface (qmapmux*) is configured by
# NetworkManager during activation and must not be marked unmanaged.
[device-myron-cellular]
match-device=type:gsm
managed=0
